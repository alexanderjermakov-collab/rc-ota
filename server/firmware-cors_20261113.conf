# Alternative to a proxy: manufacturer Apache configuration for the public OTA
# catalogue, TXT and BIN responses. Apply on firmware.umc-poland.com, not GitHub.
# This candidate has not been installed on the manufacturer's server.
<IfModule mod_headers.c>
    SetEnvIf Origin "^https://alexanderjermakov-collab\.github\.io$" ota_origin=$0
    Header always set Access-Control-Allow-Origin "%{ota_origin}e" env=ota_origin
    Header always merge Vary "Origin"
    Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS" env=ota_origin
    Header always set Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control, Pragma" env=ota_origin
</IfModule>
